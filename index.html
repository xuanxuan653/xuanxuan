<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轩轩专属 · GPT小狗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  background: #f7f1e8;
  color: #4a382d;
}

.app {
  width: min(900px, 94%);
  margin: 0 auto;
  padding: 18px 0 35px;
}

h1 {
  text-align: center;
  margin: 5px 0 18px;
  font-size: 25px;
}

/* =========================
   小狗房间
========================= */

.room {
  position: relative;
  height: 390px;
  overflow: hidden;
  border-radius: 28px;
  background: linear-gradient(#dff3ff 0 62%, #ead7bd 62%);
  box-shadow: 0 10px 30px rgba(70, 50, 30, .12);
}

.window {
  position: absolute;
  top: 28px;
  left: 28px;
  width: 120px;
  height: 100px;
  border: 8px solid white;
  border-radius: 15px;
  background: #9edcff;
  box-shadow: 0 5px 12px rgba(0,0,0,.08);
}

.window::before,
.window::after {
  content: "";
  position: absolute;
  background: white;
}

.window::before {
  width: 6px;
  height: 100%;
  left: 50%;
  transform: translateX(-50%);
}

.window::after {
  width: 100%;
  height: 6px;
  top: 50%;
  transform: translateY(-50%);
}

.rug {
  position: absolute;
  width: 270px;
  height: 100px;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: #f4dfc4;
}

.bowl {
  position: absolute;
  bottom: 58px;
  left: 45px;
  font-size: 42px;
}

.ball {
  position: absolute;
  right: 65px;
  bottom: 65px;
  font-size: 40px;
  cursor: pointer;
  user-select: none;
  transition: transform .2s;
}

.ball:active {
  transform: scale(.85);
}

/* =========================
   小狗
========================= */

.dog {
  position: absolute;
  left: 50%;
  top: 53%;
  transform: translate(-50%, -50%);
  font-size: 105px;
  cursor: pointer;
  user-select: none;
  z-index: 5;
  transition:
    left .65s ease,
    top .65s ease,
    transform .18s ease;
  animation: breathe 2.2s ease-in-out infinite;
}

.dog:active {
  transform: translate(-50%, -50%) scale(.92);
}

@keyframes breathe {
  0%,100% {
    margin-top: 0;
  }
  50% {
    margin-top: 4px;
  }
}

.dog.happy {
  animation: happy .65s ease;
}

@keyframes happy {
  0% { transform: translate(-50%, -50%) scale(1); }
  35% { transform: translate(-50%, -50%) scale(1.13) rotate(-5deg); }
  70% { transform: translate(-50%, -50%) scale(1.1) rotate(5deg); }
  100% { transform: translate(-50%, -50%) scale(1); }
}

.dog.pet {
  animation: pet .75s ease;
}

@keyframes pet {
  0% { transform: translate(-50%, -50%) scale(1); }
  30% { transform: translate(-50%, -50%) scale(1.08) rotate(-3deg); }
  55% { transform: translate(-50%, -50%) scale(.97) rotate(3deg); }
  100% { transform: translate(-50%, -50%) scale(1); }
}

.dog.eat {
  animation: eat .9s ease;
}

@keyframes eat {
  0%,100% {
    transform: translate(-50%, -50%) rotate(0);
  }
  25% {
    transform: translate(-50%, -47%) rotate(-5deg);
  }
  50% {
    transform: translate(-50%, -53%) rotate(5deg);
  }
  75% {
    transform: translate(-50%, -47%) rotate(-4deg);
  }
}

.dog.play {
  animation: play .8s ease;
}

@keyframes play {
  0% {
    transform: translate(-50%, -50%) rotate(0);
  }
  25% {
    transform: translate(-50%, -50%) rotate(-10deg) scale(1.05);
  }
  50% {
    transform: translate(-50%, -50%) rotate(10deg) scale(1.08);
  }
  75% {
    transform: translate(-50%, -50%) rotate(-7deg) scale(1.04);
  }
  100% {
    transform: translate(-50%, -50%) rotate(0) scale(1);
  }
}

/* =========================
   气泡
========================= */

.bubble {
  position: absolute;
  left: 50%;
  top: 18%;
  transform: translateX(-50%);
  max-width: 75%;
  padding: 10px 17px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 5px 18px rgba(0,0,0,.1);
  font-size: 15px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s, top .25s;
  z-index: 10;
}

.bubble.show {
  opacity: 1;
  top: 13%;
}

/* =========================
   操作区
========================= */

.actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 15px;
}

button {
  border: 0;
  padding: 12px 8px;
  border-radius: 15px;
  background: white;
  color: #4a382d;
  font-size: 15px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

button:active {
  transform: scale(.96);
}

.status {
  text-align: center;
  min-height: 24px;
  margin: 13px 0;
  color: #806653;
}

/* =========================
   GPT 聊天
========================= */

.chat {
  margin-top: 20px;
  background: white;
  border-radius: 22px;
  padding: 16px;
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

.chat-title {
  font-weight: 700;
  margin-bottom: 10px;
}

.messages {
  height: 230px;
  overflow-y: auto;
  padding: 8px;
  background: #faf8f5;
  border-radius: 15px;
}

.message {
  margin: 8px 0;
  padding: 9px 12px;
  border-radius: 13px;
  max-width: 85%;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  margin-left: auto;
  background: #e5f2ff;
}

.assistant {
  background: #f0e8df;
}

.chat-input {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.chat-input input {
  flex: 1;
  min-width: 0;
  border: 1px solid #ddd;
  border-radius: 13px;
  padding: 11px;
  font-size: 15px;
  outline: none;
}

.chat-input button {
  width: 52px;
  padding: 0;
}

.voice {
  margin-top: 8px;
  width: 100%;
}
</style>
</head>

<body>

<div class="app">

  <h1>🐶 轩轩专属 · GPT小狗</h1>

  <div class="room">

    <div class="window"></div>
    <div class="rug"></div>

    <div class="bowl">🥣</div>

    <div
      class="ball"
      id="ball"
      onclick="playBall()"
      title="点击玩球"
    >🎾</div>

    <div
      class="dog"
      id="dog"
      onclick="clickDog()"
      title="点击小狗"
    >🐶</div>

    <div class="bubble" id="bubble"></div>

  </div>

  <div class="status" id="status">
    小狗正在看着你
  </div>

  <div class="actions">
    <button onclick="petDog()">👋 摸摸头</button>
    <button onclick="feedDog()">🍖 喂小狗</button>
    <button onclick="playBall()">🎾 玩球</button>
    <button onclick="callDog()">🐶 呼唤</button>
  </div>


  <!-- GPT 聊天 -->
  <div class="chat">

    <div class="chat-title">
      💬 和GPT小狗聊天
    </div>

    <div
      class="messages"
      id="messages"
    ></div>

    <div class="chat-input">

      <input
        id="chatInput"
        type="text"
        placeholder="和小狗说点什么……"
        onkeydown="if(event.key==='Enter') sendMessage()"
      >

      <button onclick="sendMessage()">
        ➤
      </button>

    </div>

    <button
      class="voice"
      onclick="startVoice()"
      id="voiceButton"
    >
      🎤 语音输入
    </button>

  </div>

</div>


<script>

/* =========================
   小狗互动
========================= */

const dog = document.getElementById("dog");
const bubble = document.getElementById("bubble");
const statusText = document.getElementById("status");

let bubbleTimer = null;


function say(text) {

  bubble.textContent = text;

  bubble.classList.remove("show");

  clearTimeout(bubbleTimer);

  setTimeout(() => {
    bubble.classList.add("show");
  }, 20);

  bubbleTimer = setTimeout(() => {
    bubble.classList.remove("show");
  }, 2600);
}


function animateDog(className) {

  dog.classList.remove(
    "happy",
    "pet",
    "eat",
    "play"
  );

  void dog.offsetWidth;

  dog.classList.add(className);

  setTimeout(() => {
    dog.classList.remove(className);
  }, 1000);
}


/* 直接点击小狗 */

function clickDog() {

  animateDog("happy");

  statusText.textContent =
    "小狗开心地看着你";

  const replies = [
    "汪！你终于来啦～",
    "汪汪！摸我嘛！",
    "嘿嘿，被你发现啦。",
    "我在这里～",
    "汪！"
  ];

  say(
    replies[
      Math.floor(Math.random() * replies.length)
    ]
  );
}


/* 摸摸头 */

function petDog() {

  animateDog("pet");

  statusText.textContent =
    "你轻轻摸了摸小狗的头";

  say("好舒服呀……再摸一下嘛。");
}


/* 喂小狗 */

function feedDog() {

  animateDog("eat");

  statusText.textContent =
    "小狗正在吃东西";

  say("谢谢你喂我！好好吃～");
}


/* 玩球 */

function playBall() {

  statusText.textContent =
    "小狗跑过去玩球了";

  say("球球！我要玩！");

  const oldLeft = dog.style.left;
  const oldTop = dog.style.top;

  dog.style.left = "78%";
  dog.style.top = "66%";

  animateDog("play");

  setTimeout(() => {

    animateDog("play");

    statusText.textContent =
      "小狗开心地把球叼回来了";

    say("汪！再来一次！");

    setTimeout(() => {

      dog.style.left =
        oldLeft || "50%";

      dog.style.top =
        oldTop || "53%";

    }, 700);

  }, 1000);
}


/* 呼唤 */

function callDog() {

  statusText.textContent =
    "你在呼唤小狗……";

  say("汪！我听到啦！");

  animateDog("happy");
}


/* =========================
   GPT 聊天
========================= */

const messages = document.getElementById("messages");
const input = document.getElementById("chatInput");


function addMessage(text, type) {

  const div =
    document.createElement("div");

  div.className =
    "message " + type;

  div.textContent = text;

  messages.appendChild(div);

  messages.scrollTop =
    messages.scrollHeight;
}


async function sendMessage() {

  const text =
    input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  try {

    const response =
      await fetch("/api/chat", {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          message: text
        })

      });


    if (!response.ok) {
      throw new Error("请求失败");
    }


    const data =
      await response.json();


    const reply =
      data.reply ||
      data.message ||
      data.content ||
      "汪……我不知道怎么回答。";


    addMessage(
      reply,
      "assistant"
    );

    say(reply);

  } catch (error) {

    console.error(error);

    addMessage(
      "暂时连接不到GPT，请检查你的后端/API设置。",
      "assistant"
    );

    say("唔……GPT好像暂时连不上。");
  }
}


/* =========================
   语音输入
========================= */

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    alert(
      "你的浏览器暂不支持语音识别。可以尝试使用 Safari 或 Chrome。"
    );

    return;
  }


  const recognition =
    new SpeechRecognition();

  recognition.lang = "zh-CN";

  recognition.interimResults = false;

  recognition.continuous = false;


  const voiceButton =
    document.getElementById("voiceButton");


  voiceButton.textContent =
    "🎙️ 正在听……";


  recognition.start();


  recognition.onresult =
    function(event) {

      const text =
        event.results[0][0].transcript;

      input.value = text;

      sendMessage();
    };


  recognition.onerror =
    function() {

      voiceButton.textContent =
        "🎤 语音输入";

    };


  recognition.onend =
    function() {

      voiceButton.textContent =
        "🎤 语音输入";

    };

}

</script>

</body>
</html>
