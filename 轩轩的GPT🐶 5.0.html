<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>轩轩专属 · GPT小狗</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,
    "PingFang SC","Helvetica Neue",Arial,sans-serif;
}

body{
    background:
    radial-gradient(circle at 20% 10%,rgba(255,255,255,.95),transparent 28%),
    radial-gradient(circle at 90% 30%,rgba(255,220,235,.8),transparent 30%),
    linear-gradient(160deg,#fff8f5 0%,#fff0f5 48%,#f7efff 100%);
    color:#51434b;
}

.app{
    width:100%;
    height:100%;
    max-width:520px;
    margin:auto;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* =========================
   顶部
========================= */

.topbar{
    padding:22px 20px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:relative;
    z-index:5;
}

.title-area{
    display:flex;
    flex-direction:column;
}

.small-title{
    font-size:12px;
    letter-spacing:2px;
    color:#b99ba7;
    margin-bottom:3px;
}

.main-title{
    font-size:24px;
    font-weight:800;
    letter-spacing:-.5px;
    color:#55434d;
}

.profile{
    width:48px;
    height:48px;
    border-radius:18px;
    background:rgba(255,255,255,.78);
    box-shadow:0 8px 25px rgba(130,90,110,.12);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
}

/* =========================
   状态
========================= */

.status-card{
    margin:8px 18px 12px;
    padding:12px 15px;
    background:rgba(255,255,255,.68);
    border:1px solid rgba(255,255,255,.9);
    border-radius:22px;
    box-shadow:0 10px 30px rgba(130,90,110,.08);
    backdrop-filter:blur(15px);
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar-dot{
    width:40px;
    height:40px;
    border-radius:15px;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:22px;
    box-shadow:0 4px 12px rgba(120,80,100,.08);
}

.status-text{
    flex:1;
}

.status-name{
    font-size:14px;
    font-weight:750;
    color:#58454e;
}

.status-online{
    margin-top:2px;
    font-size:11px;
    color:#a9979e;
}

.online-dot{
    display:inline-block;
    width:6px;
    height:6px;
    background:#9fd9ad;
    border-radius:50%;
    margin-right:4px;
}

/* =========================
   宠物房间
========================= */

.pet-room{
    flex:1;
    margin:0 14px;
    position:relative;
    border-radius:36px;
    overflow:hidden;
    background:
    radial-gradient(circle at 50% 35%,rgba(255,255,255,.9),transparent 32%),
    linear-gradient(180deg,#fff8fa 0%,#fff1f2 65%,#f9e9ef 100%);
    box-shadow:
    inset 0 1px rgba(255,255,255,.9),
    0 18px 45px rgba(135,90,110,.11);
}

.cloud{
    position:absolute;
    border-radius:40px;
    background:rgba(255,255,255,.55);
}

.cloud1{
    width:90px;
    height:32px;
    top:48px;
    left:-15px;
}

.cloud2{
    width:100px;
    height:36px;
    top:95px;
    right:-20px;
}

.star{
    position:absolute;
    color:#e8bfd0;
    font-size:17px;
    animation:twinkle 2.8s ease-in-out infinite;
}

.s1{top:34px;left:27%}
.s2{top:120px;right:25%;animation-delay:.8s}
.s3{top:180px;left:12%;font-size:12px;animation-delay:1.4s}
.s4{top:210px;right:13%;font-size:13px;animation-delay:2s}

@keyframes twinkle{
    0%,100%{opacity:.35;transform:scale(.8)}
    50%{opacity:1;transform:scale(1.25)}
}

/* =========================
   对话框
========================= */

.bubble{
    position:absolute;
    top:22px;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 55px);
    min-height:52px;
    padding:13px 17px;
    border-radius:21px;
    background:rgba(255,255,255,.9);
    box-shadow:0 9px 25px rgba(120,80,100,.1);
    text-align:center;
    font-size:14px;
    font-weight:600;
    color:#66525c;
    z-index:30;
}

.bubble:after{
    content:"";
    position:absolute;
    bottom:-7px;
    left:50%;
    transform:translateX(-50%) rotate(45deg);
    width:14px;
    height:14px;
    background:rgba(255,255,255,.9);
}

/* =========================
   狗狗舞台
========================= */

.dog-stage{
    position:absolute;
    width:290px;
    height:350px;
    left:50%;
    top:50%;
    transform:translate(-50%,-39%);
}

.ground-shadow{
    position:absolute;
    width:190px;
    height:32px;
    left:50px;
    bottom:17px;
    border-radius:50%;
    background:rgba(126,87,103,.13);
    filter:blur(7px);
}

/* =========================
   狗狗
========================= */

.dog{
    position:absolute;
    width:250px;
    height:325px;
    left:20px;
    bottom:20px;
    animation:dogFloat 3.2s ease-in-out infinite;
    transform-origin:center bottom;
}

@keyframes dogFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-6px);
    }
}

/* =========================
   尾巴
========================= */

.tail{
    position:absolute;
    width:75px;
    height:100px;
    right:-8px;
    bottom:91px;
    z-index:1;
    transform-origin:left bottom;
    animation:tailWag 1s ease-in-out infinite;
}

.tail-main{
    position:absolute;
    width:58px;
    height:78px;
    left:8px;
    top:10px;
    border:16px solid #fff;
    border-left:0;
    border-bottom-color:#fff;
    border-radius:0 60px 60px 0;
    transform:rotate(-18deg);
}

.tail-tip{
    position:absolute;
    width:27px;
    height:27px;
    right:2px;
    top:2px;
    border-radius:50%;
    background:#fff;
}

@keyframes tailWag{
    0%,100%{transform:rotate(-8deg)}
    50%{transform:rotate(12deg)}
}

/* =========================
   身体
========================= */

.body{
    position:absolute;
    width:150px;
    height:142px;
    left:50px;
    bottom:53px;
    border-radius:50% 50% 43% 43%;
    background:
    radial-gradient(circle at 35% 18%,#fff 0%,#fff 55%,#eee7e6 100%);
    box-shadow:
    inset -7px -9px rgba(218,207,207,.32),
    0 14px 25px rgba(120,80,90,.09);
    z-index:3;
}

/* 身体毛绒边缘 */

.body-fluff{
    position:absolute;
    width:45px;
    height:50px;
    border-radius:50%;
    background:#fff;
    top:40px;
}

.body-fluff.left{
    left:-18px;
}

.body-fluff.right{
    right:-18px;
}

/* =========================
   四条腿
========================= */

.leg{
    position:absolute;
    width:43px;
    height:75px;
    bottom:27px;
    border-radius:24px;
    background:linear-gradient(180deg,#fff,#eee7e6);
    box-shadow:inset -5px -7px rgba(211,198,198,.3);
    z-index:5;
}

.leg.left{
    left:62px;
}

.leg.right{
    right:62px;
}

.paw{
    position:absolute;
    width:48px;
    height:29px;
    left:-3px;
    bottom:-5px;
    border-radius:50%;
    background:#fff;
}

/* =========================
   头部
========================= */

.head{
    position:absolute;
    width:210px;
    height:190px;
    left:20px;
    top:34px;
    border-radius:48% 48% 45% 45%;
    background:
    radial-gradient(circle at 35% 20%,#fff 0%,#fff 55%,#eee7e7 100%);
    box-shadow:
    inset -7px -8px rgba(215,203,203,.28),
    0 15px 27px rgba(120,80,90,.1);
    z-index:10;
}

/* 头顶的小毛毛 */

.head-fluff{
    position:absolute;
    width:48px;
    height:35px;
    left:81px;
    top:-9px;
    border-radius:50%;
    background:#fff;
}

.head-fluff:before,
.head-fluff:after{
    content:"";
    position:absolute;
    width:38px;
    height:32px;
    border-radius:50%;
    background:#fff;
    top:6px;
}

.head-fluff:before{
    left:-25px;
}

.head-fluff:after{
    right:-25px;
}

/* =========================
   耳朵
========================= */

.ear{
    position:absolute;
    width:65px;
    height:91px;
    top:42px;
    z-index:-1;
    background:linear-gradient(150deg,#f7eeee,#e5d4d6);
    box-shadow:inset -6px -6px rgba(198,179,183,.28);
}

.ear.left{
    left:-17px;
    border-radius:24px 17px 45px 38px;
    transform:rotate(17deg);
}

.ear.right{
    right:-17px;
    border-radius:17px 24px 38px 45px;
    transform:rotate(-17deg);
}

.ear-inner{
    position:absolute;
    width:38px;
    height:61px;
    top:15px;
    left:14px;
    border-radius:50%;
    background:#eccfd4;
}

/* =========================
   脸部
   重要：所有五官都以 face 为基准
========================= */

.face{
    position:absolute;
    width:190px;
    height:165px;
    left:10px;
    top:17px;
    z-index:20;
}

/* =========================
   眼睛
========================= */

.eye{
    position:absolute;
    width:36px;
    height:42px;
    top:40px;
    border-radius:50%;
    background:#403339;
    box-shadow:inset 0 -5px rgba(0,0,0,.12);
    animation:blink 5s infinite;
}

.eye.left{
    left:38px;
}

.eye.right{
    right:38px;
}

.eye-highlight{
    position:absolute;
    width:11px;
    height:11px;
    left:7px;
    top:6px;
    border-radius:50%;
    background:#fff;
}

.eye-highlight-small{
    position:absolute;
    width:5px;
    height:5px;
    right:7px;
    bottom:8px;
    border-radius:50%;
    background:#fff;
}

@keyframes blink{
    0%,44%,47%,100%{
        transform:scaleY(1);
    }
    45%,46%{
        transform:scaleY(.12);
    }
}

/* =========================
   腮红
========================= */

.cheek{
    position:absolute;
    width:39px;
    height:18px;
    top:91px;
    border-radius:50%;
    background:#f4bbc6;
    opacity:.68;
}

.cheek.left{
    left:13px;
}

.cheek.right{
    right:13px;
}

/* =========================
   嘴部区域
   鼻子、嘴巴、舌头全部锁在这里
========================= */

.muzzle{
    position:absolute;
    width:78px;
    height:67px;
    left:56px;
    top:79px;
    border-radius:50%;
    background:#fff;
    z-index:25;
}

/* 鼻子 */

.nose{
    position:absolute;
    width:31px;
    height:22px;
    left:23px;
    top:3px;
    border-radius:48% 48% 55% 55%;
    background:#382d31;
    z-index:30;
}

.nose-shine{
    position:absolute;
    width:8px;
    height:5px;
    left:6px;
    top:4px;
    border-radius:50%;
    background:rgba(255,255,255,.72);
}

/* 嘴巴 */

.mouth{
    position:absolute;
    width:54px;
    height:30px;
    left:12px;
    top:21px;
    z-index:29;
}

/* 左嘴角 */

.mouth-left{
    position:absolute;
    width:28px;
    height:18px;
    left:0;
    top:0;
    border-bottom:4px solid #57434a;
    border-radius:0 0 0 22px;
    transform:rotate(7deg);
}

/* 右嘴角 */

.mouth-right{
    position:absolute;
    width:28px;
    height:18px;
    right:0;
    top:0;
    border-bottom:4px solid #57434a;
    border-radius:0 0 22px 0;
    transform:rotate(-7deg);
}

/* 舌头 */

.tongue{
    position:absolute;
    width:23px;
    height:23px;
    left:15px;
    top:15px;
    border-radius:0 0 14px 14px;
    background:#f19aaa;
    z-index:28;
}

/* 舌头中间的小线 */

.tongue-line{
    position:absolute;
    width:2px;
    height:10px;
    left:10px;
    top:4px;
    border-radius:2px;
    background:rgba(180,90,105,.3);
}

/* =========================
   蝴蝶结
========================= */

.bow{
    position:absolute;
    width:68px;
    height:45px;
    right:0;
    top:0;
    z-index:35;
    transform:rotate(7deg);
}

.bow-left,
.bow-right{
    position:absolute;
    width:34px;
    height:30px;
    top:7px;
    background:#e7a0b3;
}

.bow-left{
    left:0;
    border-radius:22px 8px 22px 8px;
    transform:rotate(-16deg);
}

.bow-right{
    right:0;
    border-radius:8px 22px 8px 22px;
    transform:rotate(16deg);
}

.bow-center{
    position:absolute;
    width:19px;
    height:19px;
    left:25px;
    top:13px;
    border-radius:50%;
    background:#d67e98;
}

/* =========================
   摸头动画
========================= */

.dog.pet{
    animation:petDog .7s ease;
}

@keyframes petDog{
    0%{
        transform:scale(1);
    }
    25%{
        transform:scale(1.08) rotate(-2deg);
    }
    50%{
        transform:scale(.97) rotate(2deg);
    }
    75%{
        transform:scale(1.04);
    }
    100%{
        transform:scale(1);
    }
}

/* =========================
   底部
========================= */

.bottom{
    padding:12px 15px 18px;
}

.controls{
    background:rgba(255,255,255,.78);
    border:1px solid rgba(255,255,255,.9);
    border-radius:28px;
    padding:9px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    box-shadow:0 13px 35px rgba(120,80,100,.12);
    backdrop-filter:blur(18px);
}

.action{
    border:0;
    background:transparent;
    border-radius:21px;
    padding:10px 4px 8px;
    color:#75616a;
    font-family:inherit;
    font-size:11px;
    font-weight:650;
}

.action:active{
    transform:scale(.91);
    background:rgba(250,225,232,.65);
}

.action-icon{
    width:43px;
    height:43px;
    margin:0 auto 5px;
    border-radius:16px;
    background:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:21px;
    box-shadow:0 5px 13px rgba(120,80,100,.09);
}

/* =========================
   Toast
========================= */

.toast{
    position:absolute;
    left:50%;
    bottom:105px;
    transform:translate(-50%,20px);
    padding:10px 17px;
    border-radius:18px;
    background:rgba(65,53,60,.86);
    color:#fff;
    font-size:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:50;
    white-space:nowrap;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   小屏幕
========================= */

@media(max-height:700px){

    .topbar{
        padding-top:13px;
    }

    .main-title{
        font-size:21px;
    }

    .status-card{
        margin-top:4px;
        margin-bottom:7px;
    }

    .bubble{
        top:13px;
    }

    .dog-stage{
        transform:translate(-50%,-43%) scale(.86);
    }
}

@media(min-height:800px){

    .dog-stage{
        transform:translate(-50%,-39%) scale(1.02);
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- 顶部 -->
    <div class="topbar">

        <div class="title-area">
            <div class="small-title">MY LITTLE GPT PET</div>
            <div class="main-title">轩轩专属 · GPT 小狗</div>
        </div>

        <div class="profile">🐶</div>

    </div>

    <!-- 状态 -->
    <div class="status-card">

        <div class="avatar-dot">🐾</div>

        <div class="status-text">
            <div class="status-name">GPT 小狗</div>

            <div class="status-online">
                <span class="online-dot"></span>
                正在陪着你
            </div>
        </div>

    </div>

    <!-- 宠物房间 -->
    <div class="pet-room">

        <div class="decor cloud cloud1"></div>
        <div class="decor cloud cloud2"></div>

        <div class="star s1">✦</div>
        <div class="star s2">✦</div>
        <div class="star s3">✧</div>
        <div class="star s4">✧</div>

        <!-- 对话 -->
        <div class="bubble" id="bubble">
            汪～轩轩来啦，我在这里等你。
        </div>

        <!-- 狗狗 -->
        <div class="dog-stage">

            <div class="ground-shadow"></div>

            <div class="dog" id="dog">

                <!-- 尾巴 -->
                <div class="tail">
                    <div class="tail-main"></div>
                    <div class="tail-tip"></div>
                </div>

                <!-- 身体 -->
                <div class="body">

                    <div class="body-fluff left"></div>
                    <div class="body-fluff right"></div>

                </div>

                <!-- 腿 -->
                <div class="leg left">
                    <div class="paw"></div>
                </div>

                <div class="leg right">
                    <div class="paw"></div>
                </div>

                <!-- 头 -->
                <div class="head">

                    <div class="head-fluff"></div>

                    <!-- 耳朵 -->
                    <div class="ear left">
                        <div class="ear-inner"></div>
                    </div>

                    <div class="ear right">
                        <div class="ear-inner"></div>
                    </div>

                    <!-- 所有五官统一放进 face -->
                    <div class="face">

                        <!-- 左眼 -->
                        <div class="eye left">
                            <div class="eye-highlight"></div>
                            <div class="eye-highlight-small"></div>
                        </div>

                        <!-- 右眼 -->
                        <div class="eye right">
                            <div class="eye-highlight"></div>
                            <div class="eye-highlight-small"></div>
                        </div>

                        <!-- 腮红 -->
                        <div class="cheek left"></div>
                        <div class="cheek right"></div>

                        <!-- 嘴部 -->
                        <div class="muzzle">

                            <!-- 鼻子 -->
                            <div class="nose">
                                <div class="nose-shine"></div>
                            </div>

                            <!-- 嘴 -->
                            <div class="mouth">

                                <div class="mouth-left"></div>
                                <div class="mouth-right"></div>

                                <!-- 舌头 -->
                                <div class="tongue">
                                    <div class="tongue-line"></div>
                                </div>

                            </div>

                        </div>

                        <!-- 蝴蝶结 -->
                        <div class="bow">

                            <div class="bow-left"></div>
                            <div class="bow-right"></div>
                            <div class="bow-center"></div>

                        </div>

                    </div>

                </div>

            </div>
        </div>

    </div>

    <!-- 底部 -->
    <div class="bottom">

        <div class="controls">

            <button class="action" onclick="petDog()">
                <div class="action-icon">🖐🏻</div>
                摸摸头
            </button>

            <button class="action" onclick="feedDog()">
                <div class="action-icon">🍪</div>
                喂小狗
            </button>

            <button class="action" onclick="chatGPT()">
                <div class="action-icon">💬</div>
                聊聊天
            </button>

            <button class="action" onclick="voiceGPT()">
                <div class="action-icon">🎙️</div>
                说话
            </button>

        </div>

    </div>

    <div class="toast" id="toast"></div>

</div>

<script>

const dog = document.getElementById("dog");
const bubble = document.getElementById("bubble");
const toast = document.getElementById("toast");

function say(text){
    bubble.textContent = text;
}

function showToast(text){

    toast.textContent = text;
    toast.classList.add("show");

    setTimeout(function(){
        toast.classList.remove("show");
    },1600);
}

/* 摸摸头 */

function petDog(){

    dog.classList.remove("pet");

    void dog.offsetWidth;

    dog.classList.add("pet");

    say("嘿嘿～摸到我啦！汪汪！");
    showToast("小狗开心地摇尾巴啦");
}

/* 喂食 */

function feedDog(){

    dog.classList.remove("pet");

    void dog.offsetWidth;

    dog.classList.add("pet");

    say("哇！是给我的小零食吗？汪！");
    showToast("小狗正在开心吃东西");
}

/* 聊天 */

function chatGPT(){

    say("汪～你想和我聊什么呀？");
    showToast("聊天功能准备接入 GPT");
}

/* 语音 */

function voiceGPT(){

    say("🎙️ 我准备好听你说话啦。");
    showToast("下一步接入 GPT Realtime 语音");
}

</script>

</body>
</html>
